# T0 (tools/Check-Fast.ps1) on every push and pull request: static KubeJS load, lang parity, quest lint, test zones and
# the Node analysis suite. No Minecraft, no secrets, read-only token. Full logs are uploaded when it fails.
# Not a required check yet (docs/testing/ci.md says how to make it one).
name: T0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    name: T0 (Check-Fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check-Fast
        shell: pwsh
        run: ./tools/Check-Fast.ps1 -NodeExe (Get-Command node).Source
      - name: Upload T0 logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t0-logs
          path: tools/.check-fast/
          retention-days: 14
          if-no-files-found: ignore
