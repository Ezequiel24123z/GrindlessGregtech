# Dependency updates (#410). GitHub Actions is the only ecosystem here that Dependabot supports: mods are pinned by
# packwiz (unsupported) and the Node tools have no package manifest.
# Updates target the integration branch, never main, so main keeps moving by fast-forward at each release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: ezequiel24123z-project-reforge
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
